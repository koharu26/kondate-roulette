<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>コジローの気まぐれ食堂</title>
  <style>
    :root {
      --bg-color: #FFF9EB;
      --card-bg: #FFFFFF;
      --primary: #FF7B54;
      --primary-dark: #E8623C;
      --secondary: #FFB26B;
      --accent: #7FB77E;
      --accent-dark: #639A62;
      --blue: #5DA7DB;
      --blue-dark: #4389BC;
      --purple: #9B7EDE;
      --purple-dark: #7B5EC2;
      --text-main: #3D352E;
      --text-muted: #8C7F73;
      --border-radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "Meiryo", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 16px 40px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.55rem;
      color: var(--primary);
      letter-spacing: 0.04em;
      text-shadow: 2px 2px 0px #FFE0C2;
    }

    header p {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 5px;
      font-weight: bold;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .screen {
      display: none;
      animation: fadeIn 0.25s ease;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ボタンスタイル */
    .btn {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 16px 18px;
      font-size: 1.08rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
    }

    .btn:active {
      transform: translateY(3px);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #FF9671);
      color: #fff;
      box-shadow: 0 5px 0 var(--primary-dark);
    }
    .btn-primary:active { box-shadow: 0 2px 0 var(--primary-dark); }

    .btn-accent {
      background
